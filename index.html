<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Band Scheduler - Login</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <script defer src="assets/js/app.js"></script>
  <script defer src="assets/js/index.js"></script>
</head>
<body>
  <main>
    <section class="card" style="max-width:520px;margin:48px auto;">
      <h1>Band Rehearsal Scheduler</h1>
      <p class="muted">Log in with username or email.</p>
      <form id="loginForm" class="list">
        <div>
          <label for="login">Username or Email</label>
          <input id="login" name="login" required />
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required />
        </div>
        <button type="submit">Login</button>
      </form>
      <p><a href="register.html">Register New Account</a></p>
      <div id="msg" class="msg"></div>
    </section>
  </main>
</body>
</html>
